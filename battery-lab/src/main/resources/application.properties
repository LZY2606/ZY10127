# Battery Lab - local single-user application
server.port=5327
spring.application.name=battery-lab

# SQLite database (a file under the working directory, easy to inspect with sqlite3)
spring.datasource.url=jdbc:sqlite:batterylab.db?busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Deterministic JSON (ordering, no timestamps that change between runs)
spring.jackson.serialization.write-dates-as-timestamps=false

spring.threads.virtual.enabled=true
